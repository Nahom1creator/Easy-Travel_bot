<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Travel - Lowest Unique Bid Auction</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #00853f;
            --primary-dark: #006c32;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .card {
            max-width: 420px;
            margin: auto;
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
        }

        h2 { color: var(--primary); text-align: center; margin-top: 0; }
        .subtitle { text-align: center; font-size: 13px; color: #6b7280; margin-bottom: 20px; }

        .screen { display: none; }
        .screen.active { display: block; }

        .menu-btn {
            width: 100%;
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 16px;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .menu-btn:hover, .menu-btn:active {
            background: var(--primary);
            color: white;
        }

        label {
            font-weight: 700;
            display: block;
            margin-top: 14px;
            font-size: 12px;
            color: #4b5563;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            background: #f9fafb;
        }

        input:focus { border-color: var(--primary); background: #ffffff; }

        .fee-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 12px;
            margin-top: 14px;
            font-size: 13px;
        }

        .fee-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .fee-row.total {
            font-weight: 700;
            border-top: 1px dashed #93c5fd;
            padding-top: 6px;
            margin-top: 6px;
            color: #1e3a8a;
        }

        .notice-card {
            font-size: 11px;
            color: #92400e;
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 12px;
            line-height: 1.4;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 14px;
            margin-top: 18px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌍 Easy Travel</h2>
        <div class="subtitle">Lowest Unique Bid Auction</div>

        <!-- SCREEN 1: Main Category Selection -->
        <div id="screenHome" class="screen active">
            <p style="font-weight:600; font-size:14px; margin-bottom:14px;">Select Travel Category:</p>
            <button class="menu-btn" onclick="selectCategory('Local')">
                <span>🇪🇹 Local Travel</span> <span>➔</span>
            </button>
            <button class="menu-btn" onclick="selectCategory('International')">
                <span>🌍 International Travel</span> <span>➔</span>
            </button>
        </div>

        <!-- SCREEN 2: Tier / People Selection -->
        <div id="screenTiers" class="screen">
            <button class="back-btn" onclick="goHome()">❮ Back</button>
            <h3 id="tierTitle" style="margin-top:5px; color:#1f2937;">Select Package Tier</h3>
            
            <div id="localTiers" style="display:none;">
                <button class="menu-btn" onclick="selectTier('Solo (1 Person)', 70)">
                    <span>1 Person (Solo)</span> <span>70 ETB</span>
                </button>
                <button class="menu-btn" onclick="selectTier('Family (2 People)', 100)">
                    <span>2 People (Family)</span> <span>100 ETB</span>
                </button>
                <button class="menu-btn" onclick="selectTier('Group (3+ People)', 300)">
                    <span>3+ People (Group)</span> <span>300 ETB</span>
                </button>
            </div>

            <div id="intlTiers" style="display:none;">
                <button class="menu-btn" onclick="selectTier('Solo (1 Person)', 300)">
                    <span>1 Person (Solo)</span> <span>300 ETB</span>
                </button>
                <button class="menu-btn" onclick="selectTier('Family (2 People)', 450)">
                    <span>2 People (Family)</span> <span>450 ETB</span>
                </button>
                <button class="menu-btn" onclick="selectTier('Group (3+ People)', 550)">
                    <span>3+ People (Group)</span> <span>550 ETB</span>
                </button>
            </div>
        </div>

        <!-- SCREEN 3: Route & 3-Digit Bid Input -->
        <div id="screenBid" class="screen">
            <button class="back-btn" onclick="goTiers()">❮ Back</button>
            <h3 id="bidHeader" style="margin-top:5px; font-size:15px; color:var(--primary);"></h3>

            <label for="routeText">Travel Route:</label>
            <input type="text" id="routeText" placeholder="e.g. Addis Ababa to Lalibela / Dubai">

            <label for="bidAmount">3-Digit Max Bid Amount (ETB):</label>
            <input type="text" id="bidAmount" placeholder="e.g. 111 or 999" maxlength="3" oninput="validateBid()">

            <div class="fee-box">
                <div class="fee-row">
                    <span>Your Bid:</span>
                    <span id="dispBid">0 ETB</span>
                </div>
                <div class="fee-row">
                    <span>Service Fee:</span>
                    <span id="dispFee">0 ETB</span>
                </div>
                <div class="fee-row total">
                    <span>Total Telebirr Payable:</span>
                    <span id="dispTotal">0 ETB</span>
                </div>
            </div>

            <div class="notice-card">
                ⚠️ <b>Rule:</b> Bids must be numbers of <b>3 digits or less</b> (max 999). After submitting, you must send your Telebirr screenshot to <b>@easy_travel</b>.
            </div>

            <button class="action-btn" onclick="submitBidForm()">📲 Proceed to Telebirr Payment</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let state = {
            category: '',
            tierName: '',
            serviceFee: 0
        };

        function selectCategory(cat) {
            state.category = cat;
            document.getElementById('screenHome').classList.remove('active');
            document.getElementById('screenTiers').classList.add('active');
            
            document.getElementById('tierTitle').innerText = cat + " Travel Packages";
            document.getElementById('localTiers').style.display = cat === 'Local' ? 'block' : 'none';
            document.getElementById('intlTiers').style.display = cat === 'International' ? 'block' : 'none';
        }

        function selectTier(tierName, fee) {
            state.tierName = tierName;
            state.serviceFee = fee;

            document.getElementById('screenTiers').classList.remove('active');
            document.getElementById('screenBid').classList.add('active');

            document.getElementById('bidHeader').innerText = `${state.category} ➔ ${tierName} (${fee} ETB Fee)`;
            calculateTotals();
        }

        function goHome() {
            document.getElementById('screenTiers').classList.remove('active');
            document.getElementById('screenHome').classList.add('active');
        }

        function goTiers() {
            document.getElementById('screenBid').classList.remove('active');
            document.getElementById('screenTiers').classList.add('active');
        }

        function validateBid() {
            let input = document.getElementById('bidAmount').value;
            // Keep only numbers up to 3 digits
            input = input.replace(/[^0-9]/g, '').slice(0, 3);
            document.getElementById('bidAmount').value = input;
            calculateTotals();
        }

        function calculateTotals() {
            const rawBid = document.getElementById('bidAmount').value;
            const numBid = parseInt(rawBid) || 0;
            const total = numBid + state.serviceFee;

            document.getElementById('dispBid').innerText = numBid + " ETB";
            document.getElementById('dispFee').innerText = state.serviceFee + " ETB";
            document.getElementById('dispTotal').innerText = total + " ETB";
        }

        function submitBidForm() {
            const route = document.getElementById('routeText').value.trim();
            const bidVal = document.getElementById('bidAmount').value.trim();

            if (!route) {
                alert("Please enter your travel route!");
                return;
            }

            if (!bidVal || bidVal.length === 0 || parseInt(bidVal) <= 0) {
                alert("Please enter a valid bid amount!");
                return;
            }

            if (bidVal.length > 3) {
                alert("Bid must be 3 digits or less (maximum 999)!");
                return;
            }

            const total = parseInt(bidVal) + state.serviceFee;

            const payload = {
                category: state.category,
                packageTier: state.tierName,
                route: route,
                bidAmount: bidVal,
                serviceFee: state.serviceFee,
                totalPayable: total
            };

            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
