<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Travel - Lowest Unique Bid Auction</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f4f8;
            color: #1a202c;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 420px;
            margin: auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            color: #00853f;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        .header p {
            font-size: 13px;
            color: #718096;
            margin-top: 4px;
        }
        .timer-box {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 14px;
            font-size: 13px;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #f8fafc;
            color: #1a202c;
            outline: none;
            transition: all 0.2s;
        }
        select:focus, input:focus {
            border-color: #00853f;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(0,133,63,0.1);
        }
        .telebirr-banner {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .telebirr-banner span {
            font-size: 12px;
            color: #0369a1;
            font-weight: 600;
        }
        .rules {
            font-size: 12px;
            color: #4a5568;
            margin-top: 16px;
            line-height: 1.5;
            background: #f7fafc;
            border-left: 4px solid #00853f;
            padding: 10px 12px;
            border-radius: 6px;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #00853f, #006c32);
            color: white;
            border: none;
            padding: 15px;
            margin-top: 22px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,133,63,0.3);
            transition: all 0.2s;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>✈️ Easy Travel</h2>
            <p>Lowest Unique Bid Flight & Travel Auction</p>
        </div>
        
        <div class="timer-box">
            ⏳ Auction Closes In: <span id="countdown">12:45:30</span>
        </div>
        
        <label for="route">Select Travel Route / Package:</label>
        <select id="route">
            <optgroup label="👨‍👩‍👧‍👦 Family & Group Packages">
                <option value="Family Package ➔ Lalibela (4 Seats)">Family Package ➔ Lalibela (4 Seats)</option>
                <option value="Family Package ➔ Bahir Dar (4 Seats)">Family Package ➔ Bahir Dar (4 Seats)</option>
                <option value="Family Getaway ➔ Dubai (4 Seats)">Family Getaway ➔ Dubai (4 Seats)</option>
                <option value="Family Holiday ➔ Mombasa Beach (4 Seats)">Family Holiday ➔ Mombasa Beach (4 Seats)</option>
            </optgroup>
            <optgroup label="🇪🇹 Domestic Solo Routes">
                <option value="Addis Ababa ➔ Lalibela">Addis Ababa ➔ Lalibela</option>
                <option value="Addis Ababa ➔ Gondar">Addis Ababa ➔ Gondar</option>
                <option value="Addis Ababa ➔ Bahir Dar">Addis Ababa ➔ Bahir Dar</option>
                <option value="Addis Ababa ➔ Axum">Addis Ababa ➔ Axum</option>
                <option value="Addis Ababa ➔ Dire Dawa">Addis Ababa ➔ Dire Dawa</option>
            </optgroup>
            <optgroup label="🌍 International Solo Routes">
                <option value="Addis Ababa ➔ Dubai">Addis Ababa ➔ Dubai</option>
                <option value="Addis Ababa ➔ Nairobi">Addis Ababa ➔ Nairobi</option>
                <option value="Addis Ababa ➔ Cairo">Addis Ababa ➔ Cairo</option>
                <option value="Addis Ababa ➔ Bangkok">Addis Ababa ➔ Bangkok</option>
                <option value="Addis Ababa ➔ Washington DC">Addis Ababa ➔ Washington DC</option>
            </optgroup>
        </select>

        <label for="bidAmount">Your Unique Bid Amount (ETB):</label>
        <input type="number" id="bidAmount" placeholder="e.g. 2450 ETB" min="1">

        <div class="telebirr-banner">
            📲 <span>Pay bidding fee securely via Telebirr upon submission!</span>
        </div>

        <div class="rules">
            📌 <b>How to Win:</b> The winner is the participant who submits the lowest unique bid amount that <b>no one else</b> has chosen!
        </div>

        <button onclick="submitBid()">Proceed to Telebirr Payment</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let timeRemaining = 12 * 3600 + 45 * 60 + 30;
        setInterval(() => {
            if (timeRemaining > 0) timeRemaining--;
            let hours = Math.floor(timeRemaining / 3600);
            let minutes = Math.floor((timeRemaining % 3600) / 60);
            let seconds = timeRemaining % 60;
            document.getElementById('countdown').innerText = 
                String(hours).padStart(2, '0') + ":" + 
                String(minutes).padStart(2, '0') + ":" + 
                String(seconds).padStart(2, '0');
        }, 1000);

        function submitBid() {
            const route = document.getElementById('route').value;
            const bidAmount = document.getElementById('bidAmount').value;
            
            if (!bidAmount || bidAmount <= 0) {
                alert("Please enter a valid bid amount!");
                return;
            }

            const auctionData = {
                route: route,
                bidAmount: bidAmount
            };

            tg.sendData(JSON.stringify(auctionData));
        }
    </script>
</body>
</html>
