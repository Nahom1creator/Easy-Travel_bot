<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Travel - Lowest Unique Bid Auction</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #00853f;
            --primary-dark: #006c32;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .card {
            max-width: 420px;
            margin: auto;
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .hero-banner {
            width: 100%;
            height: 130px;
            background: linear-gradient(rgba(0,133,63,0.4), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=800&q=80') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            color: white;
            box-sizing: border-box;
        }

        .hero-banner h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
        }

        .content {
            padding: 18px;
        }

        /* 2 Option Toggle Buttons */
        .category-toggle {
            display: flex;
            background: #e5e7eb;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            border: none;
            background: transparent;
            color: #6b7280;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(0,133,63,0.3);
        }

        label {
            font-weight: 700;
            display: block;
            margin-top: 12px;
            font-size: 12px;
            color: #4b5563;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            background: #f9fafb;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        .fee-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 12px;
            margin-top: 14px;
            font-size: 13px;
        }

        .fee-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .fee-row.total {
            font-weight: 700;
            border-top: 1px dashed #93c5fd;
            padding-top: 6px;
            margin-top: 6px;
            color: #1e3a8a;
        }

        .notice-card {
            font-size: 11px;
            color: #92400e;
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 12px;
            line-height: 1.4;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 14px;
            margin-top: 16px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="hero-banner">
            <h1>Easy Travel</h1>
            <p style="margin:2px 0 0 0; font-size:12px;">Lowest Unique Bid Auction</p>
        </div>

        <div class="content">
            <!-- Two Options Toggle -->
            <div class="category-toggle">
                <button class="tab-btn active" id="btnLocal" onclick="selectCategory('local')">🇪🇹 Local</button>
                <button class="tab-btn" id="btnIntl" onclick="selectCategory('international')">🌍 International</button>
            </div>

            <label for="routeText">Travel Route / Details:</label>
            <input type="text" id="routeText" placeholder="e.g. Addis Ababa to Lalibela or Dubai">

            <label for="peopleCount">Number of Travelers:</label>
            <select id="peopleCount" onchange="calculateTotal()">
                <option value="1">Solo (1 Person)</option>
                <option value="2">Family / Group (2 People)</option>
                <option value="3">Family / Group (3+ People)</option>
            </select>

            <label for="bidAmount">3-Digit Unique Bid Amount (ETB):</label>
            <input type="text" id="bidAmount" placeholder="e.g. 111 or 1.02" maxlength="5" oninput="validateAndCalculate()">

            <div class="fee-box">
                <div class="fee-row">
                    <span>Your Bid Amount:</span>
                    <span id="dispBid">0 ETB</span>
                </div>
                <div class="fee-row">
                    <span>Category Service Fee:</span>
                    <span id="dispFee">70 ETB</span>
                </div>
                <div class="fee-row total">
                    <span>Total Telebirr Payable:</span>
                    <span id="dispTotal">70 ETB</span>
                </div>
            </div>

            <div class="notice-card">
                ⚠️ <b>Rule:</b> Bids must consist of exactly 3 digits (e.g., 111, 405, or 1.02). After submitting, you must send your Telebirr payment screenshot to <b>@easy_travel</b> to validate your bid.
            </div>

            <button class="submit-btn" onclick="submitBid()">📲 Proceed to Telebirr Payment</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentCategory = 'local';

        function selectCategory(cat) {
            currentCategory = cat;
            document.getElementById('btnLocal').classList.toggle('active', cat === 'local');
            document.getElementById('btnIntl').classList.toggle('active', cat === 'international');
            calculateTotal();
        }

        function validateAndCalculate() {
            let input = document.getElementById('bidAmount').value;
            input = input.replace(/[^0-9.]/g, '');
            document.getElementById('bidAmount').value = input;
            calculateTotal();
        }

        function getServiceFee() {
            const count = document.getElementById('peopleCount').value;
            if (currentCategory === 'local') {
                if (count === "1") return 70;
                if (count === "2") return 100;
                return 300;
            } else {
                if (count === "1") return 300;
                if (count === "2") return 400;
                return 500;
            }
        }

        function calculateTotal() {
            const rawBid = document.getElementById('bidAmount').value;
            const numBid = parseFloat(rawBid) || 0;
            const fee = getServiceFee();
            const total = numBid + fee;

            document.getElementById('dispBid').innerText = numBid + " ETB";
            document.getElementById('dispFee').innerText = fee + " ETB";
            document.getElementById('dispTotal').innerText = total + " ETB";
        }

        function submitBid() {
            const route = document.getElementById('routeText').value.trim();
            const bidVal = document.getElementById('bidAmount').value.trim();
            
            if (!route) {
                alert("Please enter your travel route!");
                return;
            }

            const digitCount = bidVal.replace(/[^0-9]/g, '').length;
            if (digitCount !== 3) {
                alert("Invalid Bid! Your bid must contain exactly 3 digits (e.g. 111, 405, or 1.02).");
                return;
            }

            const fee = getServiceFee();
            const total = (parseFloat(bidVal) || 0) + fee;

            const data = {
                category: currentCategory.toUpperCase(),
                route: route,
                peopleCount: document.getElementById('peopleCount').value,
                bidAmount: bidVal,
                serviceFee: fee,
                totalPayable: total
            };

            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
